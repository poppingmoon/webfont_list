name: CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - parallel:
        - name: Format
          run: dart format --set-exit-if-changed .

        - name: Analyze
          run: flutter analyze

        - name: Test
          run: flutter test
